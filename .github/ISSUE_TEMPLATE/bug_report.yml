name: Zgłoszenie błędu
description: Coś działa źle w aplikacji lub w danych
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Co się stało?
      description: Opisz błąd i czego się spodziewałeś.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak odtworzyć
      placeholder: |
        1. Wpisz „Gorlice” w wyszukiwarkę
        2. Kliknij pierwszy wynik
        3. …
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link do widoku (z adresu strony)
      placeholder: https://…/#q=gorlice
  - type: input
    id: browser
    attributes:
      label: Przeglądarka i urządzenie
      placeholder: Chrome 131, Android
