name: Dane + demo (GitHub Pages)

# Pobiera aktualne dane z dane.gov.pl, buduje places.json i publikuje demo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # co poniedziałek — dane w rejestrze się zmieniają
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy
        run: python -m unittest discover -s tests
      - name: Pobranie danych z dane.gov.pl i budowa
        run: python scripts/fetch_data.py --force
      - name: Raport jakości danych
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("web/data/places.json"))
          s = d["stats"]
          print("## Dane", d["generated"])
          print(f"- miejsc na mapie: **{len(d['rows']):,}**")
          for k, v in sorted(s.items()):
              print(f"- `{k}`: {v:,}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
