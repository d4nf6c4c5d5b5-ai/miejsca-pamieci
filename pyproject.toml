[project]
name = "miejsca-pamieci"
version = "1.2.0"
description = "Mapa miejsc pamięci w Polsce na podstawie otwartych danych z dane.gov.pl"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # tylko biblioteka standardowa

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0912", "PLR0915", "PLC0415", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/make_fixtures.py" = ["E501"]
